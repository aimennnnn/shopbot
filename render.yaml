# Render Blueprint for the agent API (free plan, Docker).
services:
  - type: web
    name: shopbot-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: api
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MODEL
        value: claude-haiku-5-5
